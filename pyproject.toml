[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-adaptive-budget-lab"
version = "0.2.0"
description = "Observable, bounded adaptive token budgets for vLLM V1"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "upstream_payload"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.14.0"]
runtime = ["vllm==0.22.1"]

